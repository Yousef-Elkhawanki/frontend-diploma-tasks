<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1576" width="1000" height="1576" role="img" aria-labelledby="mt md">
  <title id="mt">Design reference: Fell Ridge Trail</title>
  <desc id="md">Wireframe mockup of the intended layout, with the challenge palette listed underneath.</desc>
  <rect x="0" y="0" width="1000" height="1576" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="46" rx="10" fill="#dfe3e8"/>
  <circle cx="26" cy="23" r="6" fill="#b9c0c8"/>
  <circle cx="48" cy="23" r="6" fill="#b9c0c8"/>
  <circle cx="70" cy="23" r="6" fill="#b9c0c8"/>
  <rect x="96" y="12" width="876" height="22" rx="11" fill="#f4f6f8"/>
  <text x="500" y="27" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7580" text-anchor="middle">fellridge.example — photographic bands; two of them stay still while the page scrolls</text>
  <rect x="0" y="46" width="1000" height="250" rx="0" fill="#1d3b2a"/>
  <text x="500" y="167" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#f2f5f1" text-anchor="middle">HERO — full-bleed photograph, darkened so white text stays readable, centred title + subtitle + pill-shaped button. The</text>
<text x="500" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#f2f5f1" text-anchor="middle">photograph does not move when the page scrolls.</text>
  <rect x="140" y="320" width="720" height="80" rx="6" fill="#ffffff" stroke="#dfe3e8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="364" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#3d4c43" text-anchor="middle">Intro paragraph — centred column</text>
  <rect x="140" y="418" width="720" height="92" rx="6" fill="#f2f5f1"/>
  <text x="500" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1d3b2a" text-anchor="middle">FACT PANEL 1 — rounded corners, thin border, small circular colour badge on the left made with a fixed-</text>
<text x="500" y="476" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1d3b2a" text-anchor="middle">size, non-repeating background image</text>
  <rect x="140" y="524" width="720" height="92" rx="6" fill="#f2f5f1"/>
  <text x="500" y="574" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1d3b2a" text-anchor="middle">FACT PANEL 2 — same treatment, different badge</text>
  <rect x="140" y="630" width="720" height="92" rx="6" fill="#f2f5f1"/>
  <text x="500" y="680" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1d3b2a" text-anchor="middle">FACT PANEL 3</text>
  <rect x="0" y="748" width="1000" height="200" rx="0" fill="#0f1f17"/>
  <text x="500" y="844" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8ece7" text-anchor="middle">FIXED BAND — second photograph, also held still, with a quotation over it. Scroll past this and the text moves while</text>
<text x="500" y="863" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e8ece7" text-anchor="middle">the photo stays put.</text>
  <rect x="140" y="972" width="720" height="118" rx="6" fill="#e7ece6"/>
  <text x="500" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1d3b2a" text-anchor="middle">STAGE SECTION — small repeating pattern tiled across the background, content sits on top</text>
  <rect x="140" y="1106" width="720" height="118" rx="6" fill="#e7ece6"/>
  <text x="500" y="1170" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1d3b2a" text-anchor="middle">STAGE SECTION 2 — same tile, positioned differently</text>
  <rect x="140" y="1248" width="720" height="110" rx="6" fill="#ffffff" stroke="#7d8a80" stroke-width="2"/>
  <text x="500" y="1308" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1d3b2a" text-anchor="middle">Practical information — bordered box, generous inner padding</text>
  <rect x="0" y="1382" width="1000" height="70" rx="0" fill="#1d3b2a"/>
  <text x="500" y="1422" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#e8ece7" text-anchor="middle">Footer band</text>
  <line x1="28" y1="1466" x2="972" y2="1466" stroke="#dfe3e8" stroke-width="1"/>
  <text x="72" y="1492" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7580" text-anchor="middle">Palette</text>
  <rect x="138" y="1474" width="26" height="26" rx="5" fill="#1d3b2a" stroke="#cfd5db"/>
  <text x="170" y="1482" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Forest</text>
  <text x="170" y="1495" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#1d3b2a</text>
  <rect x="254" y="1474" width="26" height="26" rx="5" fill="#0f1f17" stroke="#cfd5db"/>
  <text x="286" y="1482" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Deep</text>
  <text x="286" y="1495" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#0f1f17</text>
  <rect x="370" y="1474" width="26" height="26" rx="5" fill="#f2f5f1" stroke="#cfd5db"/>
  <text x="402" y="1482" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Mist</text>
  <text x="402" y="1495" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#f2f5f1</text>
  <rect x="486" y="1474" width="26" height="26" rx="5" fill="#7d8a80" stroke="#cfd5db"/>
  <text x="518" y="1482" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Stone</text>
  <text x="518" y="1495" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#7d8a80</text>
  <rect x="602" y="1474" width="26" height="26" rx="5" fill="#e0a33e" stroke="#cfd5db"/>
  <text x="634" y="1482" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Sun</text>
  <text x="634" y="1495" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#e0a33e</text>
</svg>
