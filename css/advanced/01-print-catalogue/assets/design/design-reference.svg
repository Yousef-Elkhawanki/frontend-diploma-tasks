  <title id="mt">Design reference: Halftone print catalogue</title>
  <desc id="md">Wireframe mockup of the intended layout, with the challenge palette listed underneath.</desc>
  <rect x="0" y="0" width="1000" height="1254" fill="#ffffff"/>
