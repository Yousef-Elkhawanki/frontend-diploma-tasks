  <text x="156" y="792" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#191919" text-anchor="middle">CARD</text>
  <rect x="279" y="714" width="213" height="150" rx="6" fill="#ffffff" stroke="#ded7cb" stroke-width="2"/>
