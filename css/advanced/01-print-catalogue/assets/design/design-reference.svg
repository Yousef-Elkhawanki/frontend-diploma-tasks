  <text x="500" y="27" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7580" text-anchor="middle">halftone.example / prints — a two-dimensional grid; the card wall reflows without media queries</text>
  <rect x="0" y="46" width="163" height="68" rx="6" fill="#191919"/>
  <text x="82" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#faf8f5" text-anchor="middle">Logo</text>
  <rect x="173" y="46" width="653" height="68" rx="6" fill="#191919"/>
  <text x="500" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#faf8f5" text-anchor="middle">Header — grid places the logo, the navigation and the basket on one row</text>
  <rect x="837" y="46" width="163" height="68" rx="6" fill="#a4553a"/>
  <text x="918" y="84" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">Basket</text>
