  <rect x="737" y="548" width="213" height="150" rx="6" fill="#ffffff" stroke="#ded7cb" stroke-width="2"/>
  <text x="844" y="626" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#191919" text-anchor="middle">CARD</text>
