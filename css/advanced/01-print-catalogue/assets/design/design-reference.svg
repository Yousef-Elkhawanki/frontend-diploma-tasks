  <text x="267" y="230" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f4f6ee" text-anchor="middle">FEATURED PRINT — this cell spans two columns and two rows</text>
<text x="267" y="247" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#f4f6ee" text-anchor="middle">of the same grid</text>
