<text x="386" y="792" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#191919" text-anchor="middle">per row as the window allows, each</text>
<text x="386" y="806" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#191919" text-anchor="middle">at least a readable minimum width</text>
