<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1130" width="1000" height="1130" role="img" aria-labelledby="mt md">
  <title id="mt">Design reference: Nocturne streaming browse</title>
  <desc id="md">Wireframe mockup of the intended layout, with the challenge palette listed underneath.</desc>
  <rect x="0" y="0" width="1000" height="1130" fill="#0d0f14"/>
  <rect x="0" y="0" width="1000" height="46" rx="10" fill="#20242e"/>
  <circle cx="26" cy="23" r="6" fill="#b9c0c8"/>
  <circle cx="48" cy="23" r="6" fill="#b9c0c8"/>
  <circle cx="70" cy="23" r="6" fill="#b9c0c8"/>
  <rect x="96" y="12" width="876" height="22" rx="11" fill="#f4f6f8"/>
  <text x="500" y="27" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7580" text-anchor="middle">nocturne.example / browse — design tokens, pseudo-element overlays, motion</text>
  <rect x="0" y="46" width="163" height="60" rx="0" fill="#0d0f14"/>
  <text x="82" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#f2f4f8" text-anchor="middle">Nocturne</text>
  <rect x="173" y="46" width="653" height="60" rx="0" fill="#171a22"/>
  <text x="500" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#c8cdd8" text-anchor="middle">TOP BAR — translucent over the page, navigation + search</text>
  <rect x="837" y="46" width="163" height="60" rx="0" fill="#7b5cf0"/>
  <text x="918" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">Profile</text>
  <rect x="0" y="106" width="1000" height="200" rx="0" fill="#1b1430"/>
  <text x="500" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f2f4f8" text-anchor="middle">BILLBOARD — artwork with a dark veil drawn over it by a decorative layer, not by an extra element. Title, meta row, two buttons. A small animated</text>
<text x="500" y="218" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f2f4f8" text-anchor="middle">'live' dot pulses beside the label.</text>
  <rect x="44" y="328" width="912" height="44" rx="0" fill="#0d0f14"/>
  <text x="500" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f2f4f8" text-anchor="middle">Row heading — Continue watching (a short accent bar sits before the text, drawn with a decorative layer)</text>
  <rect x="44" y="382" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="130" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD — resting state</text>
  <rect x="229" y="382" width="171" height="140" rx="6" fill="#232838" stroke="#7b5cf0" stroke-width="2"/>
  <text x="315" y="413" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#f2f4f8" text-anchor="middle">CARD — hovered or keyboard-</text>
<text x="315" y="427" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#f2f4f8" text-anchor="middle">focused: lifts and scales</text>
<text x="315" y="441" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#f2f4f8" text-anchor="middle">slightly, artwork brightens,</text>
<text x="315" y="455" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#f2f4f8" text-anchor="middle">a title strip slides up from</text>
<text x="315" y="469" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#f2f4f8" text-anchor="middle">the bottom edge. The change</text>
<text x="315" y="483" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#f2f4f8" text-anchor="middle">eases in and out rather than</text>
<text x="315" y="497" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#f2f4f8" text-anchor="middle">snapping.</text>
  <rect x="414" y="382" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="500" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD</text>
  <rect x="600" y="382" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="685" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD</text>
  <rect x="785" y="382" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="870" y="456" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD</text>
  <rect x="44" y="528" width="912" height="26" rx="0" fill="#0d0f14"/>
  <text x="500" y="544" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#8a93a6" text-anchor="middle">Each card shows a thin progress bar of how much has been watched</text>
  <rect x="44" y="574" width="912" height="44" rx="0" fill="#0d0f14"/>
  <text x="500" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f2f4f8" text-anchor="middle">Row heading — New this week</text>
  <rect x="44" y="628" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="130" y="694" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD — corner badge drawn</text>
<text x="130" y="708" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#c8cdd8" text-anchor="middle">with a decorative layer</text>
  <rect x="229" y="628" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="315" y="702" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD</text>
  <rect x="414" y="628" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="500" y="702" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD</text>
  <rect x="600" y="628" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="685" y="702" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD</text>
  <rect x="785" y="628" width="171" height="140" rx="6" fill="#1a1e27"/>
  <text x="870" y="702" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#c8cdd8" text-anchor="middle">CARD</text>
  <rect x="44" y="790" width="597" height="120" rx="6" fill="#12202a"/>
  <text x="343" y="846" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8fd8e0" text-anchor="middle">THEME PANEL — the same tokens re-declared on one section give it a different accent without</text>
<text x="343" y="861" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8fd8e0" text-anchor="middle">touching any other rule</text>
  <rect x="657" y="790" width="299" height="120" rx="6" fill="#161a22"/>
  <text x="807" y="846" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a93a6" text-anchor="middle">Skeleton row — three placeholder blocks with a</text>
<text x="807" y="861" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a93a6" text-anchor="middle">gentle looping shimmer</text>
  <rect x="0" y="930" width="1000" height="76" rx="0" fill="#0d0f14"/>
  <text x="500" y="972" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#8a93a6" text-anchor="middle">Footer — muted links, respects reduced-motion preferences</text>
  <line x1="28" y1="1020" x2="972" y2="1020" stroke="#dfe3e8" stroke-width="1"/>
  <text x="72" y="1046" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7580" text-anchor="middle">Palette</text>
  <rect x="138" y="1028" width="26" height="26" rx="5" fill="#0d0f14" stroke="#cfd5db"/>
  <text x="170" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Near black</text>
  <text x="170" y="1049" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#0d0f14</text>
  <rect x="254" y="1028" width="26" height="26" rx="5" fill="#1a1e27" stroke="#cfd5db"/>
  <text x="286" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Panel</text>
  <text x="286" y="1049" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#1a1e27</text>
  <rect x="370" y="1028" width="26" height="26" rx="5" fill="#f2f4f8" stroke="#cfd5db"/>
  <text x="402" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Off-white</text>
  <text x="402" y="1049" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#f2f4f8</text>
  <rect x="486" y="1028" width="26" height="26" rx="5" fill="#7b5cf0" stroke="#cfd5db"/>
  <text x="518" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Violet</text>
  <text x="518" y="1049" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#7b5cf0</text>
  <rect x="602" y="1028" width="26" height="26" rx="5" fill="#23c1c9" stroke="#cfd5db"/>
  <text x="634" y="1036" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Cyan</text>
  <text x="634" y="1049" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#23c1c9</text>
