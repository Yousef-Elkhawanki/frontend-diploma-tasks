  <text x="634" y="1208" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Slate</text>
  <text x="634" y="1221" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#667085</text>
