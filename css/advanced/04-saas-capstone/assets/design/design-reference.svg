<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1302" width="1000" height="1302" role="img" aria-labelledby="mt md">
  <title id="mt">Design reference: Northwind Signal — capstone landing page</title>
  <desc id="md">Wireframe mockup of the intended layout, with the challenge palette listed underneath.</desc>
  <rect x="0" y="0" width="1000" height="1302" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="46" rx="10" fill="#dfe3e8"/>
  <circle cx="26" cy="23" r="6" fill="#b9c0c8"/>
  <circle cx="48" cy="23" r="6" fill="#b9c0c8"/>
  <circle cx="70" cy="23" r="6" fill="#b9c0c8"/>
  <rect x="96" y="12" width="876" height="22" rx="11" fill="#f4f6f8"/>
  <text x="500" y="27" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7580" text-anchor="middle">signal.example — every part of the module on one responsive page</text>
  <rect x="0" y="46" width="163" height="62" rx="0" fill="#101828"/>
  <text x="82" y="81" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#ffffff" text-anchor="middle">Signal</text>
  <rect x="173" y="46" width="653" height="62" rx="0" fill="#101828"/>
  <text x="500" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#cfd6e4" text-anchor="middle">STICKY HEADER — links centred, becomes a stacked panel under a menu on small screens</text>
  <rect x="837" y="46" width="163" height="62" rx="0" fill="#3f4fd6"/>
  <text x="918" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">Start free</text>
  <rect x="0" y="108" width="600" height="210" rx="0" fill="#f6f7fb"/>
  <text x="300" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#101828" text-anchor="middle">HERO — heading that scales smoothly with the window, subheading, two buttons, trust</text>
<text x="300" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#101828" text-anchor="middle">line. A soft accent shape sits behind the heading, drawn with a decorative layer.</text>
  <rect x="600" y="108" width="400" height="210" rx="0" fill="#101828"/>
  <text x="800" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#cfd6e4" text-anchor="middle">PRODUCT SHOT — keeps its shape at every width</text>
  <rect x="0" y="318" width="240" height="92" rx="0" fill="#eef1f8"/>
  <text x="120" y="360" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">Stat — 4 figures in a row that becomes 2</text>
<text x="120" y="374" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">by 2, then 1, as the window narrows</text>
  <rect x="254" y="318" width="240" height="92" rx="0" fill="#eef1f8"/>
  <text x="373" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">Stat</text>
  <rect x="507" y="318" width="240" height="92" rx="0" fill="#eef1f8"/>
  <text x="627" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">Stat</text>
  <rect x="760" y="318" width="240" height="92" rx="0" fill="#eef1f8"/>
  <text x="880" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">Stat</text>
  <rect x="50" y="434" width="434" height="170" rx="6" fill="#ffffff" stroke="#dbe0ec" stroke-width="2"/>
  <text x="267" y="522" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">FEATURE — the first feature spans two columns of the grid</text>
  <rect x="500" y="434" width="217" height="170" rx="6" fill="#ffffff" stroke="#dbe0ec" stroke-width="2"/>
  <text x="608" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">FEATURE — icon, heading, text;</text>
<text x="608" y="522" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">hovering or focusing the card raises</text>
<text x="608" y="536" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">it a little</text>
  <rect x="733" y="434" width="217" height="170" rx="6" fill="#ffffff" stroke="#dbe0ec" stroke-width="2"/>
  <text x="842" y="522" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">FEATURE</text>
  <rect x="50" y="620" width="217" height="120" rx="6" fill="#ffffff" stroke="#dbe0ec" stroke-width="2"/>
  <text x="158" y="684" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">FEATURE</text>
  <rect x="283" y="620" width="217" height="120" rx="6" fill="#ffffff" stroke="#dbe0ec" stroke-width="2"/>
  <text x="392" y="684" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">FEATURE</text>
  <rect x="516" y="620" width="434" height="120" rx="6" fill="#ffffff" stroke="#3f4fd6" stroke-width="2"/>
  <text x="733" y="676" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">FEATURE — an animated indicator draws attention to the live one, once, on</text>
<text x="733" y="690" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">load</text>
  <rect x="50" y="764" width="289" height="150" rx="6" fill="#ffffff" stroke="#dbe0ec" stroke-width="2"/>
  <text x="195" y="842" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#101828" text-anchor="middle">PLAN — price, features, button on the bottom edge</text>
  <rect x="355" y="764" width="289" height="150" rx="6" fill="#f3f4fe" stroke="#3f4fd6" stroke-width="2"/>
  <text x="500" y="835" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#3f4fd6" text-anchor="middle">PLAN — highlighted, with a ribbon overlapping its</text>
<text x="500" y="849" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#3f4fd6" text-anchor="middle">corner</text>
  <rect x="661" y="764" width="289" height="150" rx="6" fill="#ffffff" stroke="#dbe0ec" stroke-width="2"/>
  <text x="805" y="842" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#101828" text-anchor="middle">PLAN</text>
  <rect x="50" y="936" width="589" height="124" rx="6" fill="#101828"/>
  <text x="345" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#e7ebf5" text-anchor="middle">TESTIMONIAL — large quotation mark drawn as a decorative layer, portrait, name, role</text>
  <rect x="655" y="936" width="295" height="124" rx="6" fill="#f6f7fb"/>
  <text x="803" y="1002" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#5b6478" text-anchor="middle">LOGO WALL — six marks in a wrapping row</text>
  <rect x="0" y="1082" width="1000" height="96" rx="0" fill="#101828"/>
  <text x="500" y="1134" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#cfd6e4" text-anchor="middle">FOOTER — link columns collapse from four to two to one; sign-up field and button sit on one line until there is no room</text>
  <line x1="28" y1="1192" x2="972" y2="1192" stroke="#dfe3e8" stroke-width="1"/>
  <text x="72" y="1218" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#6b7580" text-anchor="middle">Palette</text>
