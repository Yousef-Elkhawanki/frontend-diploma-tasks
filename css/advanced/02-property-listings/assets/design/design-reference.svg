  <text x="383" y="992" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#143b32" text-anchor="middle">CARD</text>
  <rect x="508" y="938" width="218" height="100" rx="6" fill="#ffffff" stroke="#d8d2c6" stroke-width="2"/>
  <text x="617" y="992" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#143b32" text-anchor="middle">CARD</text>
  <rect x="742" y="938" width="218" height="100" rx="6" fill="#ffffff" stroke="#d8d2c6" stroke-width="2"/>
  <text x="851" y="992" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#143b32" text-anchor="middle">CARD</text>
  <rect x="0" y="1058" width="1000" height="74" rx="0" fill="#143b32"/>
  <text x="500" y="1098" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#e4ded2" text-anchor="middle">Footer — columns that collapse to one on small screens. Headings grow smoothly between the smallest and largest window, with no jump at a breakpoint.</text>
