<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1256" width="1000" height="1256" role="img" aria-labelledby="mt md">
  <title id="mt">Design reference: Fairwater property listings</title>
  <desc id="md">Wireframe mockup of the intended layout, with the challenge palette listed underneath.</desc>
  <rect x="0" y="0" width="1000" height="1256" fill="#ffffff"/>
