<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1086" width="1000" height="1086" role="img" aria-labelledby="mt md">
  <title id="mt">Design reference: Loop city transport app</title>
  <desc id="md">Wireframe mockup of the intended layout, with the challenge palette listed underneath.</desc>
  <rect x="0" y="0" width="1000" height="1086" fill="#ffffff"/>
