  <text x="286" y="1034" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">White</text>
  <text x="286" y="1047" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#fbfbfd</text>
  <rect x="370" y="1026" width="26" height="26" rx="5" fill="#d8cfc0" stroke="#cfd5db"/>
  <text x="402" y="1034" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Sand</text>
  <text x="402" y="1047" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#d8cfc0</text>
  <rect x="486" y="1026" width="26" height="26" rx="5" fill="#b4562f" stroke="#cfd5db"/>
  <text x="518" y="1034" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Terracotta</text>
  <text x="518" y="1047" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#b4562f</text>
  <rect x="602" y="1026" width="26" height="26" rx="5" fill="#3c4149" stroke="#cfd5db"/>
  <text x="634" y="1034" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3b4650">Slate</text>
  <text x="634" y="1047" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b7580">#3c4149</text>
